name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/news_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # PostgreSQL is installed directly on the runner (no containers / service images).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb news_ci
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build:core
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @news/api
      - run: npm run build -w @news/worker
      - run: npm run build -w @news/web
